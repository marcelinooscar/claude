<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservar Cita</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">🌸</div>
      <h2>Reserva tu Cita</h2>
      <p class="subtitle">Introduce tus credenciales de acceso</p>

      <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>

      <form id="login-form">
        <div class="mb-3 text-start">
          <label class="form-label">Usuario</label>
          <input type="text" class="form-control" id="username" placeholder="Introduce el usuario" required autocomplete="username">
        </div>
        <div class="mb-4 text-start">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" placeholder="Introduce la contraseña" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">
          Acceder y Reservar
        </button>
      </form>

      <div class="mt-4 pt-4 border-top">
        <a href="/admin-login.html" class="text-muted small">¿Eres el administrador? Accede aquí</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Accediendo...';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = data.redirect || '/';
        } else {
          document.getElementById('error-alert').textContent = data.error;
          document.getElementById('error-alert').classList.remove('d-none');
          btn.disabled = false;
          btn.textContent = 'Acceder y Reservar';
        }
      } catch (err) {
        document.getElementById('error-alert').textContent = 'Error de conexión. Inténtalo de nuevo.';
        document.getElementById('error-alert').classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = 'Acceder y Reservar';
      }
    });
  </script>
</body>
</html>
